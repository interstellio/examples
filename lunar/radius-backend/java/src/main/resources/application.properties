# Bind to localhost:5555, matching the other example backends.
server.address=127.0.0.1
server.port=5555

# Keep the console focused on the per-exchange logging this example prints.
spring.main.banner-mode=off
logging.level.root=WARN
logging.level.radius-backend=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %msg%n

# Connection timeouts so a slow or idle client cannot hold a thread forever.
server.tomcat.connection-timeout=10s
server.tomcat.keep-alive-timeout=120s
